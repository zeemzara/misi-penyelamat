<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FIRST AID 999 – Misi Penyelamat</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#1d2750;--navy2:#2b3870;--red:#e8484a;--amber:#ffc23d;--teal:#2bb3a3;--paper:#fff8ea;--ink:#22305a;--green:#2fa866;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--navy);font-family:'Baloo 2',ui-rounded,'Nunito','Trebuchet MS',system-ui,sans-serif;color:var(--ink)}
#app{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;position:relative;overflow-x:hidden}
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;color:#fff;font-weight:800}
.top b{font-size:1.1rem}.dots{display:flex;gap:6px;padding:0 14px 8px}
.dots i{flex:1;height:10px;border-radius:6px;background:#ffffff30}.dots i.on{background:var(--teal)}.dots i.now{background:var(--amber)}
.top .k{background:#ffffff1f;border-radius:14px;padding:2px 12px}
main{flex:1;padding:6px 14px 20px;display:flex;flex-direction:column;gap:12px;animation:in .4s ease}
@keyframes in{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.card{background:var(--paper);border-radius:26px;padding:14px;box-shadow:0 6px 0 #00000030}
.btn{font:inherit;font-weight:800;font-size:1.35rem;border:0;border-radius:24px;padding:16px 18px;background:var(--amber);color:var(--ink);box-shadow:0 6px 0 #c78f10;width:100%;cursor:pointer}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 #c78f10}
.btn.red{background:var(--red);color:#fff;box-shadow:0 6px 0 #a42a2d}.btn.green{background:var(--green);color:#fff;box-shadow:0 6px 0 #1d7a47}
.pulse{animation:pl 1.2s infinite}@keyframes pl{50%{transform:scale(1.05)}}
.scene{border-radius:22px;overflow:hidden;border:5px solid #fff;background:#fff;line-height:0}
.scene svg{width:100%;height:auto}
.opts{display:grid;gap:10px}.opt{display:flex;align-items:center;gap:12px;text-align:left;font-size:1.25rem;padding:14px 16px}
.opt span.e{font-size:2.2rem}.opt{background:#fff;box-shadow:0 5px 0 #c9c1ae}
.opt.bad{background:#ffd9d6;animation:sh .4s}.opt.ok{background:#c9f2d9;box-shadow:0 5px 0 #2fa866}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.tag{font-weight:800;font-size:1.05rem;color:var(--red)}.q{font-size:1.5rem;font-weight:800;line-height:1.15;margin:2px 0 8px}
.fb{min-height:44px;font-size:1.15rem;font-weight:700;text-align:center;padding:6px}
.file{background:#f3d98a;border-radius:6px 20px 20px 20px;padding:10px 14px;font-weight:800;font-size:1.1rem;position:relative}
.file:before{content:"";position:absolute;top:-10px;left:0;width:70px;height:12px;background:#f3d98a;border-radius:8px 8px 0 0}
.file div{padding:2px 0}.file .o{color:var(--red)}.file .g{color:var(--green)}
.center{text-align:center;color:#fff}.big{font-size:2.2rem;font-weight:800;line-height:1.05}
.phone{font-size:6rem;animation:rg .5s infinite}@keyframes rg{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
.wave{width:150px;height:150px;border-radius:50%;border:5px solid var(--red);margin:-130px auto 0;opacity:0;animation:wv 1.4s infinite}
@keyframes wv{from{transform:scale(.5);opacity:.9}to{transform:scale(2);opacity:0}}
.siren{font-size:4rem;animation:sr 1s infinite}@keyframes sr{50%{filter:drop-shadow(0 0 18px var(--red));transform:scale(1.15)}}
.float{position:absolute;font-size:2.2rem;animation:fl 3s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-12px)}}
.stamp{display:inline-block;border:6px solid var(--green);color:var(--green);font-weight:800;font-size:2rem;padding:2px 16px;border-radius:12px;transform:rotate(-8deg);animation:st .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes st{from{transform:scale(4) rotate(-30deg);opacity:0}}
.bar{height:16px;background:#ffffff30;border-radius:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--teal);transition:width 1s}
.amb{font-size:3.4rem;animation:dr 2.2s ease-in forwards}@keyframes dr{from{transform:translateX(-120px)}to{transform:translateX(130px)}}
.conf{position:fixed;top:-20px;width:10px;height:14px;animation:cf linear forwards;z-index:9}@keyframes cf{to{transform:translateY(105vh) rotate(720deg)}}
.closing{animation:cl 1s .3s forwards}@keyframes cl{to{transform:scale(.9) rotate(-3deg);background:#bfe3c9}}
.ov{position:fixed;inset:0;background:var(--navy);z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;gap:10px;animation:in .3s}
textarea{width:100%;font:inherit;font-size:1.2rem;border-radius:16px;border:3px solid #c9c1ae;padding:10px;min-height:90px}
.row{display:flex;justify-content:space-between;font-size:1.3rem;font-weight:800;padding:6px 0;border-bottom:2px dashed #d8cfb8}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
.in{width:100%;font:inherit;font-weight:700;font-size:1.2rem;text-align:center;border-radius:18px;border:4px solid var(--amber);padding:10px;margin-bottom:8px;background:#fff;color:var(--ink)}
.in.err{border-color:var(--red);animation:sh .4s}
.cert{background:var(--paper);border-radius:26px;border:6px double #d9a21b;padding:16px;text-align:center;box-shadow:0 6px 0 #00000030}
.cert .nm{font-size:2rem;font-weight:800;color:var(--red);line-height:1.1;word-break:break-word}
</style>
</head>
<body>
<div id="app"></div>
<script>
const app=document.getElementById('app');
const PL=[['🏠','Rumah'],['🏫','Sekolah'],['🌳','Tempat Awam']];
const E={'Terkena air panas':'☕','Terlanggar pintu':'🚪','Jatuh dari pokok':'🌴','Tergelincir / terjatuh':'🏃','Terlanggar meja':'🪑','Terjatuh':'🤸','Terlanggar objek':'💥','Melecur':'🔥','Lebam':'🤕','Terseliuh':'🦶','Luka':'🩹'};
const C=[
{p:0,call:'Tolong! Ada seorang kanak-kanak terkena air panas di dapur!',a:['Terkena air panas','Terlanggar pintu','Jatuh dari pokok'],i:['Melecur','Lebam','Terseliuh']},
{p:1,call:'Seorang murid terjatuh ketika berlari di sekolah. Lututnya sakit!',a:['Tergelincir / terjatuh','Terkena air panas','Terlanggar meja'],i:['Luka','Melecur','Terseliuh']},
{p:2,call:'Tolong! Seorang kanak-kanak jatuh di taman. Kakinya sakit dan bengkak!',a:['Terjatuh','Terkena air panas','Terlanggar objek'],i:['Terseliuh','Melecur','Luka']},
{p:0,call:'Seorang kanak-kanak terlanggar bucu meja di rumah!',a:['Terlanggar objek','Terjatuh','Terkena air panas'],i:['Lebam','Melecur','Terseliuh']},
{p:1,call:'Murid terjatuh semasa bermain dan sikunya terluka!',a:['Terjatuh','Terkena air panas','Terlanggar objek'],i:['Luka','Lebam','Melecur']},
{p:2,call:'Tolong! Kanak-kanak terjatuh daripada permainan di taman dan badannya lebam!',a:['Terjatuh','Terkena air panas','Terlanggar objek'],i:['Lebam','Luka','Terseliuh']}
];
const S={n:'',k:'',c:0,done:0,q:0,res:[0,0,0],opts:[]};
const sh=a=>[...a].sort(()=>Math.random()-.5);
const kid=(x,y,c,r=0,s=1)=>`<g transform="translate(${x} ${y}) rotate(${r}) scale(${s})"><rect x="-9" y="14" width="18" height="24" rx="6" fill="${c}"/><rect x="-8" y="36" width="6" height="16" rx="3" fill="#3b4a7a"/><rect x="2" y="36" width="6" height="16" rx="3" fill="#3b4a7a"/><circle r="14" fill="#f6c9a0"/><path d="M-14-3Q-12-17 0-16Q12-17 14-3Q6-10-14-3Z" fill="#4a3426"/><circle cx="-5" cy="1" r="1.8" fill="#222"/><circle cx="5" cy="1" r="1.8" fill="#222"/><ellipse cy="8" rx="2.5" ry="3" fill="#c0504d"/></g>`;
const plaster=(x,y)=>`<g transform="translate(${x} ${y}) rotate(-30)"><rect x="-10" y="-4" width="20" height="8" rx="4" fill="#f5c28b" stroke="#c9915a"/></g>`;
const bruise=(x,y)=>`<ellipse cx="${x}" cy="${y}" rx="8" ry="6" fill="#8d6bb8" opacity=".75"/>`;
const bub=(x,y)=>`<g><circle cx="${x}" cy="${y}" r="13" fill="#fff" stroke="#e8484a" stroke-width="3"/><text x="${x}" y="${y+6}" font-size="18" font-weight="800" text-anchor="middle" fill="#e8484a">!</text></g>`;
const BG={
k:`<rect width="300" height="200" fill="#ffe9c7"/><rect y="150" width="300" height="50" fill="#d9b186"/><rect x="190" y="25" width="80" height="60" rx="6" fill="#bfe3f5" stroke="#fff" stroke-width="5"/><rect x="10" y="18" width="60" height="38" rx="4" fill="#2bb3a3"/><rect x="80" y="18" width="60" height="38" rx="4" fill="#2bb3a3"/><rect y="92" width="170" height="58" fill="#2bb3a3"/><rect x="-5" y="86" width="180" height="10" fill="#e9b872"/><path d="M85 96v54" stroke="#1f8f83" stroke-width="3"/><text x="40" y="130" font-size="22">🍳</text>`,
r:`<rect width="300" height="200" fill="#dff0ff"/><rect y="150" width="300" height="50" fill="#c9a27a"/><rect x="25" y="25" width="70" height="55" rx="6" fill="#bfe3f5" stroke="#fff" stroke-width="5"/><rect x="120" y="30" width="50" height="38" rx="4" fill="#f2a65a"/><rect x="150" y="108" width="125" height="12" rx="3" fill="#9a6a3f"/><rect x="158" y="120" width="8" height="40" fill="#7a4f2c"/><rect x="258" y="120" width="8" height="40" fill="#7a4f2c"/><text x="215" y="102" font-size="22">🧸</text>`,
s:`<rect width="300" height="200" fill="#bfe3f5"/><rect y="140" width="300" height="60" fill="#9ed57a"/><rect x="150" y="30" width="135" height="95" rx="6" fill="#f2a65a"/><rect x="165" y="50" width="24" height="24" fill="#fff"/><rect x="205" y="50" width="24" height="24" fill="#fff"/><rect x="245" y="50" width="24" height="24" fill="#fff"/><rect x="205" y="90" width="30" height="35" fill="#8a5a33"/><path d="M150 30L217 8L285 30Z" fill="#e8484a"/><circle cx="40" cy="38" r="20" fill="#ffe27a"/><rect y="150" width="300" height="10" fill="#e9d9a8"/>`,
t:`<rect width="300" height="200" fill="#bfe3f5"/><rect y="140" width="300" height="60" fill="#8fd16d"/><circle cx="240" cy="55" r="30" fill="#4aa84f"/><circle cx="215" cy="70" r="24" fill="#5bbd5f"/><rect x="232" y="75" width="12" height="70" fill="#8a5a33"/><circle cx="35" cy="35" r="18" fill="#ffe27a"/><text x="130" y="38" font-size="20">☁️</text>`
};
const X={
0:()=>`<g transform="translate(150 70) rotate(60)"><rect width="18" height="22" rx="3" fill="#fff" stroke="#999"/></g><ellipse cx="170" cy="168" rx="34" ry="8" fill="#9fd6f0"/><path d="M160 60q-6-10 0-18q6-8 0-16" stroke="#fff" fill="none" stroke-width="3"/>${kid(215,98,'#ff7a59')}<circle cx="232" cy="130" r="6" fill="#e8484a"/>${bub(255,70)}`,
1:()=>`<path d="M30 170h60l-30-45z" fill="#ffc23d" stroke="#c78f10" stroke-width="3" transform="translate(120 5) scale(.7)"/>${kid(70,140,'#4aa3ff',-80)}${plaster(113,152)}${kid(200,100,'#f2a65a',0,.85)}${kid(255,100,'#a77bd8',0,.85)}${bub(80,105)}`,
2:()=>`<text x="150" y="170" font-size="22">⚽</text>${kid(75,140,'#ff7a59',-80)}<ellipse cx="127" cy="152" rx="10" ry="8" fill="#ff9a8a" stroke="#e8484a" stroke-width="2"/>${kid(200,100,'#4aa3ff',0,.85)}${bub(78,105)}`,
3:()=>`${kid(128,98,'#ff7a59',0)}${bruise(139,126)}<text x="144" y="112" font-size="20">💥</text>${bub(100,70)}`,
4:()=>`<text x="110" y="175" font-size="22">⚽</text>${kid(70,142,'#4aa3ff',-80)}${plaster(95,160)}${kid(215,148,'#f2a65a',0,.7)}${kid(255,148,'#a77bd8',0,.7)}${bub(75,105)}`,
5:()=>`<polygon points="150,150 190,150 190,60 175,60" fill="#ffc23d" stroke="#c78f10" stroke-width="3"/><rect x="185" y="55" width="40" height="8" fill="#e8484a"/><rect x="220" y="55" width="6" height="95" fill="#8a5a33"/>${kid(100,142,'#4aa3ff',-80)}${bruise(130,152)}${kid(270,100,'#a77bd8',0,.8)}${bub(100,105)}`
};
const scene=n=>{const c=C[n],b=[BG.k,BG.s,BG.t,BG.r,BG.s,BG.t][[0,1,2,3,1,2][n]===undefined?0:[0,1,2,3,1,2][n]];return`<div class="scene"><svg viewBox="0 0 300 200">${[BG.k,BG.s,BG.t,BG.r,BG.s,BG.t][n]}${X[n]()}</svg></div>`};
const dots=()=>[0,1,2,3,4,5].map(i=>`<i class="${i<S.done?'on':i==S.c?'now':''}"></i>`).join('');
function show(h,top=true){app.innerHTML=(top?`<div class="top"><b>🚨 FIRST AID 999</b><span class="k">KES ${Math.min(S.c+1,6)} / 6</span></div><div class="dots">${dots()}</div>`:'')+`<main>${h}</main>`}
const fileCard=(done,cls='')=>{const L=['Tempat','Kemalangan','Kecederaan'];return`<div class="file ${cls}">📁 FAIL KES 0${S.c+1}${L.map((l,i)=>`<div class="${S.res[i]?'g':'o'}">${S.res[i]?'✓':'🔴'} ${l.toUpperCase()}</div>`).join('')}${done?'<div class="g">🟢 KES SELESAI</div>':'<div class="o">🔴 KES BELUM SELESAI</div>'}</div>`};
function cover(){S.c=0;S.done=0;S.q=0;S.res=[0,0,0];
 app.innerHTML=`<main style="justify-content:center;text-align:center;position:relative;min-height:100dvh">
 <span class="float" style="left:8%;top:10%">📞</span><span class="float" style="right:8%;top:14%;animation-delay:.6s">🔎</span><span class="float" style="left:10%;bottom:24%;animation-delay:1s">📁</span><span class="float" style="right:10%;bottom:26%;animation-delay:1.5s">🚑</span>
 <div class="siren">🚨</div>
 <div class="center big" style="font-size:3rem">FIRST AID<br><span style="color:var(--amber);font-size:4.4rem">999</span></div>
 <div class="center" style="font-weight:800;letter-spacing:.12em;font-size:1.2rem">MISI PENYELAMAT</div>
 <div style="width:190px;margin:0 auto"><svg viewBox="-30 -30 120 130"><g transform="translate(30 0)">${kid(0,10,'#4aa3ff',0,1.3).replace('<circle r="14" fill="#f6c9a0"/>','<circle r="14" fill="#f6c9a0"/><path d="M-18-8h36l-4-12h-28z" fill="#7a5a3a"/><rect x="-18" y="-9" width="36" height="5" rx="2" fill="#4a3426"/>')}<circle cx="34" cy="38" r="9" fill="none" stroke="#ffc23d" stroke-width="4"/><path d="M41 45l12 12" stroke="#ffc23d" stroke-width="5" stroke-linecap="round"/></g></svg></div>
 <p class="center" style="margin:0;font-weight:700;font-size:1.15rem">Jadilah Detektif Pertolongan Cemas!</p>
 <div><input class="in" id="nm" maxlength="30" placeholder="✏️ Nama detektif" value="${S.n.replace(/\"/g,'')}"><input class="in" id="kl" maxlength="20" placeholder="🏫 Kelas (pilihan)" value="${S.k.replace(/\"/g,'')}"></div><button class="btn red pulse" onclick="start()">📞 MULA MISI</button></main>`}
function start(){const el=document.getElementById('nm'),v=el.value.trim();if(!v){el.classList.remove('err');void el.offsetWidth;el.classList.add('err');el.placeholder='✏️ Tulis nama dahulu, detektif!';return}S.n=v;S.k=document.getElementById('kl').value.trim();app.insertAdjacentHTML('beforeend',`<div class="ov"><div class="siren">🚨</div><div class="big">BEEP... BEEP...</div><div style="font-size:1.4rem;font-weight:800;color:var(--amber)">📞 PANGGILAN KECEMASAN MASUK!</div></div>`);setTimeout(call,1900)}
function call(){S.q=0;S.res=[0,0,0];
 show(`<div class="center" style="margin-top:8px"><div style="font-weight:800;font-size:1.3rem;color:var(--amber)">📞 PANGGILAN KECEMASAN</div><div class="big">KES 0${S.c+1}</div><div class="phone">📞</div><div class="wave"></div></div>
 <div class="card" style="font-size:1.3rem;font-weight:700;text-align:center">“${C[S.c].call}”</div>
 <button class="btn green pulse" onclick="answer()">📞 JAWAB PANGGILAN</button>`)}
function answer(){
 show(`${scene(S.c)}${fileCard(0)}<div class="card" style="text-align:center;font-weight:700;font-size:1.15rem">Lihat gambar dengan teliti. Apa yang berlaku?</div><button class="btn" onclick="ask()">🔎 SIASAT KES</button>`)}
const STEP=[['📍 PETUNJUK #1','Lihat tempat kejadian dengan teliti.','DI MANAKAH KEMALANGAN BERLAKU?'],['🚨 PETUNJUK #2','Perhatikan apa yang berlaku kepada mangsa.','APAKAH YANG BERLAKU KEPADA MANGSA?'],['🩹 PETUNJUK TERAKHIR','Fikirkan bahagian badan yang sakit.','APAKAH KECEDERAAN YANG MUNGKIN BERLAKU?']];
function ask(){const c=C[S.c],q=S.q;let o;
 if(q==0)o=PL.map(p=>[p[0],p[1]]);else o=sh(q==1?c.a:c.i).map(t=>[E[t],t]);
 S.opts=o;const ans=q==0?PL[c.p][1]:(q==1?c.a[0]:c.i[0]);
 show(`<div class="scene" style="max-height:150px"><div style="margin-top:-10px">${scene(S.c).replace('class="scene"','')}</div></div>${fileCard(0).replace(/<div class="(o|g)">(?!.*KES)/g,m=>m)}
 <div class="card"><div class="tag">${STEP[q][0]}</div><div style="font-weight:700;margin-bottom:4px">“${STEP[q][1]}”</div><div class="q">${STEP[q][2]}</div><div class="opts">${o.map((x,i)=>`<button class="btn opt" data-t="${x[1]}" onclick="pick(this,'${ans}')"><span class="e">${x[0]}</span>${x[1].toUpperCase()}</button>`).join('')}</div><div class="fb" id="fb"></div></div>`)}
function pick(b,ans){const fb=document.getElementById('fb');
 if(b.dataset.t==ans){document.querySelectorAll('.opt').forEach(x=>x.disabled=true);b.classList.add('ok');S.res[S.q]=1;
  fb.innerHTML=['✅ PETUNJUK DITEMUI!','✓ KEMALANGAN DIKENAL PASTI!','✓ KECEDERAAN DIKENAL PASTI!'][S.q]+'<br>🔎 Petunjuk seterusnya...';fb.style.color='var(--green)';
  setTimeout(()=>{S.q++;S.q<3?ask():solved()},1500)}
 else{b.classList.remove('bad');void b.offsetWidth;b.classList.add('bad');fb.innerHTML='❌ BELUM TEPAT<br>Lihat keadaan sekeliling dengan lebih teliti.';fb.style.color='var(--red)'}}
function solved(){S.done++;const last=S.done==6;
 for(let i=0;i<40;i++){const d=document.createElement('i');d.className='conf';d.style.cssText=`left:${Math.random()*100}vw;background:${['#ffc23d','#e8484a','#2bb3a3','#4aa3ff','#a77bd8'][i%5]};animation-duration:${2+Math.random()*2}s;animation-delay:${Math.random()*.6}s`;document.body.appendChild(d);setTimeout(()=>d.remove(),5000)}
 show(`<div class="center"><div class="stamp" style="background:#fff8">KES SELESAI</div><div class="big" style="margin-top:8px">🚨 KES SELESAI!</div></div>
 ${fileCard(1,'closing')}
 <div class="card" style="text-align:center"><div class="amb">🚑</div><div style="font-weight:800;font-size:1.3rem">🚑 BANTUAN BERJAYA DIHANTAR!</div></div>
 <div class="center" style="font-weight:800;font-size:1.2rem">🚑 KES SELESAI: ${S.done}/6<div class="bar" style="margin-top:6px"><i style="width:${(S.done-1)/6*100}%"></i></div></div>
 <button class="btn ${last?'red':'green'}" onclick="${last?'end()':'next()'}">${last?'🏆 LIHAT KEPUTUSAN':'📞 PANGGILAN SETERUSNYA...'}</button>`);
 setTimeout(()=>{const i=document.querySelector('.bar i');if(i)i.style.width=S.done/6*100+'%'},80)}
function next(){S.c++;call()}
const esc=t=>t.replace(/[<>&"]/g,'');
function end(){S.c=5;const n=p=>C.filter(c=>c.p==p).length;const d=new Date(),dt=d.toLocaleDateString('ms-MY',{day:'numeric',month:'long',year:'numeric'}),tm=d.toLocaleTimeString('ms-MY',{hour:'2-digit',minute:'2-digit'});
 show(`<div class="center"><div style="font-size:3.4rem">🎉</div><div class="big">MISI SELESAI!</div></div>
 <div class="cert" id="cert"><div style="font-size:3rem" class="pulse">🎖️</div><div style="font-weight:800;color:var(--red)">🚨 FIRST AID 999</div><div style="font-weight:700">Lencana dibuka untuk</div><div class="nm">${esc(S.n)}</div>${S.k?`<div style="font-weight:700">Kelas ${esc(S.k)}</div>`:''}<div style="font-weight:800;font-size:1.3rem;margin:6px 0">🏆 DETEKTIF PERTOLONGAN CEMAS</div><div style="font-weight:800;font-size:1.2rem">🚑 6 / 6 KES DISELESAIKAN</div>${PL.map((p,i)=>`<div class="row"><span>${p[0]} ${p[1].toUpperCase()}</span><span style="color:var(--green)">✓ ${n(i)} kes</span></div>`).join('')}<div id="cj" style="font-weight:700;margin-top:8px"></div><div style="font-weight:700;margin-top:8px;color:#6b6a80">📅 ${dt}, ${tm}</div></div>
 <div class="card"><div class="tag">💭 CABARAN AKHIR</div><div class="q">Apakah satu kemalangan yang kita perlu berhati-hati?</div><textarea id="ans" placeholder="Tulis jawapan anda di sini..."></textarea><button class="btn green" style="margin-top:10px" onclick="fin()">✅ HANTAR JAWAPAN</button><div class="fb" id="fb"></div></div>`,false)}

 if(!v){fb.innerHTML='Tulis satu jawapan dahulu, detektif!';fb.style.color='var(--red)';return}
 document.getElementById('cj').innerHTML=`💭 Cabaran akhir:<br><span style="color:var(--red)">“${esc(v)}”</span>`;
 fb.innerHTML='📸 Sijil sudah siap! Tangkap skrin sijil di atas dan tunjuk kepada guru.';fb.style.color='var(--green)';
 document.getElementById('cert').scrollIntoView({behavior:'smooth',block:'center'});
 document.querySelector('.card .btn').outerHTML='<button class="btn" onclick="cover()">🔁 MAIN SEMULA</button>'}
cover();
</script>
